name: Idea or feature request
description: Suggest something that would make ephdrop better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Start with the problem, not the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to happen?
  - type: textarea
    id: fit
    attributes:
      label: Does it fit the project?
      description: ephdrop has no server, no account and no cloud, and files expire. Say how your idea works with that.
