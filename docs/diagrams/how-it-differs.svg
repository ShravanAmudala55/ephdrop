<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" width="920" height="400" role="img" aria-labelledby="t d">
  <title id="t">How ephdrop differs from LocalSend</title>
  <desc id="d">LocalSend pushes a file to any nearby device and the receiver accepts it. ephdrop devices are paired once, share a list of files, and a file is pulled on request and deletes itself after a day.</desc>
  <style>
    .bg{fill:#ffffff;stroke:#c9d2f0;stroke-width:1.5}
    .h{font:700 20px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#0f1b3d}
    .s{font:15px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#4a5578}
    .l{font:600 14px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#0f1b3d}
    .m{font:13px ui-monospace,Menlo,Consolas,monospace;fill:#0f1b3d}
    .dev{fill:#eef2ff;stroke:#2447f5;stroke-width:2}
    .arrow{stroke:#2447f5;stroke-width:2.5;fill:none;stroke-linecap:round}
    .grey{stroke:#8a94b8}
    .ring{fill:none;stroke:#dfe5fa;stroke-width:4}
    .arc{fill:none;stroke:#2447f5;stroke-width:4;stroke-linecap:round}
    .red{stroke:#d4382c}
    .pill{fill:#2447f5}
    .pillt{font:700 13px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;fill:#fff}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2447f5"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8a94b8"/></marker>
  </defs>

  <!-- LocalSend -->
  <rect class="bg" x="10" y="10" width="440" height="380" rx="14"/>
  <text class="h" x="34" y="48">LocalSend</text>
  <text class="s" x="34" y="72">Send to a nearby device</text>

  <rect class="dev" x="40" y="120" width="86" height="130" rx="14"/>
  <text class="l" x="83" y="190" text-anchor="middle">Phone</text>
  <rect class="dev" x="334" y="140" width="96" height="90" rx="10"/>
  <text class="l" x="382" y="190" text-anchor="middle">Laptop</text>

  <path class="arrow grey" d="M132 170 H326" marker-end="url(#g)"/>
  <text class="m" x="229" y="158" text-anchor="middle">send file</text>
  <rect x="180" y="196" width="98" height="26" rx="13" fill="#fff" stroke="#8a94b8" stroke-width="1.5"/>
  <text class="l" x="229" y="214" text-anchor="middle">Accept?</text>

  <text class="s" x="34" y="290">Any device on the Wi-Fi can offer you a file.</text>
  <text class="s" x="34" y="314">You accept each transfer.</text>
  <text class="s" x="34" y="338">Received files stay until you delete them.</text>
  <text class="s" x="34" y="362">The sender pushes.</text>

  <!-- ephdrop -->
  <rect class="bg" x="470" y="10" width="440" height="380" rx="14" style="stroke:#2447f5"/>
  <text class="h" x="494" y="48">ephdrop</text>
  <text class="s" x="494" y="72">Paired devices share a list</text>

  <rect class="dev" x="500" y="120" width="86" height="130" rx="14"/>
  <text class="l" x="543" y="190" text-anchor="middle">Phone</text>
  <rect class="dev" x="794" y="140" width="96" height="90" rx="10"/>
  <text class="l" x="842" y="190" text-anchor="middle">Laptop</text>

  <path class="arrow" d="M592 150 H788" marker-start="url(#a)" marker-end="url(#a)"/>
  <rect x="622" y="136" width="136" height="26" rx="13" class="pill"/>
  <text class="pillt" x="690" y="154" text-anchor="middle">paired once, QR</text>

  <rect x="614" y="176" width="164" height="68" rx="8" fill="#fff" stroke="#c9d2f0" stroke-width="1.5"/>
  <circle class="ring" cx="636" cy="196" r="9"/><path class="arc" d="M636 187 A9 9 0 1 1 627 196"/>
  <text class="m" x="654" y="200">photo.jpg</text>
  <circle class="ring" cx="636" cy="224" r="9"/><path class="arc red" d="M636 215 A9 9 0 0 1 645 224"/>
  <text class="m" x="654" y="228">notes.pdf</text>

  <text class="s" x="494" y="290">Only devices you paired can see your files.</text>
  <text class="s" x="494" y="314">A file downloads when you ask for it.</text>
  <text class="s" x="494" y="338">Every file deletes itself, after a day by default.</text>
  <text class="s" x="494" y="362">The receiver pulls.</text>
</svg>
